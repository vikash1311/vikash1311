name: Auto Commit

on:
  schedule:
    # Runs every day at 00:00 UTC. Adjust as needed.
    - cron: '0 0 * * *'
  workflow_dispatch: {}  # allows manual trigger from Actions tab

permissions:
  contents: write

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # If your commit depends on generating/updating files (e.g. a script,
      # data pull, build step), run that here BEFORE the commit step.
      # - name: Run update script
      #   run: python scripts/update.py

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit changes if any
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: auto commit $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
